      key: section-summary
      title: "Summary"
      path: /
      default: true
      children:
        - type: space
          key: space-summary
          title: "Summary"
          path: /
          default: true
          content:
            directory: ./

    - type: section
      key: section-technical
      title: "Technical"
      path: technical
      children:
        - type: space
          key: space-technical
          title: "Technical"
          path: technical
          default: true
