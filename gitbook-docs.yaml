            directory: ./technical

    - type: section
      key: section-non-technical
      title: "Non-Technical"
      path: non-technical
      children:
        - type: space
          key: space-non-technical
          title: "Non-Technical"
          path: non-technical
          default: true
          content:
            directory: ./non-technical